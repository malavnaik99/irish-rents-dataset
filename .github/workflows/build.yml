# Downloads the official RTB rent table from the CSO, cleans it (clean.py), publishes the result to Hugging Face
# and Kaggle (publish.py), and runs the same cleaning as a Kaggle notebook.
name: Build dataset
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      KERNEL: malavnaik/cleaning-irish-rents-rtb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas pyarrow huggingface_hub kaggle jupytext ipykernel
      - run: python clean.py
      - run: python publish.py
      - name: Run the cleaning notebook on Kaggle
        run: |
          jupytext --to ipynb --set-kernel python3 clean.py -o kaggle/notebook.ipynb
          kaggle kernels push -p kaggle
          sleep 60
          while true; do
            s=$(kaggle kernels status "$KERNEL" 2>&1 | tr 'A-Z' 'a-z'); echo "$(date -u +%H:%M) $s"
            case "$s" in *complete*) break;; *error*|*cancel*) exit 1;; esac
            sleep 30
          done
          mkdir -p kout && kaggle kernels output "$KERNEL" -p kout && grep -ho '[0-9,]* rows, [0-9]* locations[^"\\]*' kout/*.log | tail -1
